name: CI

# Cloudflare Pages bouwt en deployt zelf (main naar productie, elke andere branch als preview).
# Deze checks houden main schoon: met branch protection kan een PR pas naar main als ze groen zijn.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # dezelfde Node-versie als Cloudflare Pages: die leest ook .node-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npm run format:check

      # tsc -b en vite build: dezelfde build als op Pages
      - name: Build
        run: npm run build
